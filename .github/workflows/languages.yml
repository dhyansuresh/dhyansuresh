name: Update profile stats

on:
  schedule:
    - cron: "17 10 * * *"   # once a day
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:
    paths:
      - scripts/languages.py
      - scripts/letterboxd.py
      - scripts/panels.py
      - data/book.json
      - data/about.json
      - data/contact.json
      - .github/workflows/languages.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: pip install pillow
      - name: Count languages
        run: python3 scripts/languages.py
        env:
          LANGS_TOKEN: ${{ secrets.LANGS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Recent films from Letterboxd
        run: python3 scripts/letterboxd.py
        continue-on-error: true
      - name: Draw the DOS panels
        run: python3 scripts/panels.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data assets
          git diff --cached --quiet || (git commit -m "Update profile stats" && git push)
